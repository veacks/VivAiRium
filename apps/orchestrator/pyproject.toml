[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivairium-orchestrator"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "crewai>=0.80.0"
]

[project.scripts]
vivairium-orchestrator = "orchestrator.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
